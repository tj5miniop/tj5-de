# window border
window.active.border.color: #d77675
window.inactive.border.color: #c79b6b

# ToggleKeybinds status indicator
window.active.indicator.toggled-keybind.color: #fd4663

# window titlebar background
window.active.title.bg.color: #d77675
window.inactive.title.bg.color: #c79b6b

window.active.label.text.color: #221b1b
window.inactive.label.text.color: #221b1b
window.label.text.justify: center

# window button hover overlay
window.button.hover.bg.color: #362626

# window buttons
window.active.button.unpressed.image.color: #221b1b
window.inactive.button.unpressed.image.color: #221b1b

# menu
menu.border.color: #221b1b
menu.items.bg.color: #d77675
menu.items.text.color: #221b1b
menu.items.active.bg.color: #c79b6b
menu.items.active.text.color: #221b1b
menu.separator.color: #221b1b
menu.title.bg.color: #d77675
menu.title.text.color: #221b1b

# on screen display (window-cycle dialog)
osd.bg.color: #d77675
osd.border.color: #221b1b
osd.label.text.color: #221b1b
osd.window-switcher.preview.border.color: #746363
