# window border
window.active.border.color: #67bce4
window.inactive.border.color: #5c72d6

# ToggleKeybinds status indicator
window.active.indicator.toggled-keybind.color: #fd4663

# window titlebar background
window.active.title.bg.color: #67bce4
window.inactive.title.bg.color: #5c72d6

window.active.label.text.color: #182125
window.inactive.label.text.color: #060d11
window.label.text.justify: center

# window button hover overlay
window.button.hover.bg.color: #282e33

# window buttons
window.active.button.unpressed.image.color: #182125
window.inactive.button.unpressed.image.color: #182125

# menu
menu.border.color: #182125
menu.items.bg.color: #67bce4
menu.items.text.color: #182125
menu.items.active.bg.color: #5c72d6
menu.items.active.text.color: #060d11
menu.separator.color: #182125
menu.title.bg.color: #67bce4
menu.title.text.color: #182125

# on screen display (window-cycle dialog)
osd.bg.color: #67bce4
osd.border.color: #182125
osd.label.text.color: #182125
osd.window-switcher.preview.border.color: #606b70
